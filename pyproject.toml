[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["venv", ".venv", "**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["apps", "common"]
omit = ["*/migrations/*", "*/tests.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
